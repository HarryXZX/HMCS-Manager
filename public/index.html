<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HMCS">
<title>HMCS Manager · Minecraft 服务端管理器</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img class="mark" src="/brand/HYCX-MC.png" width="28" height="28" alt="HYCX MC">
      <div>
        <b>HMCS Manager</b>
        <span>Minecraft 服务端管理器</span>
      </div>
      <button class="icon-btn" id="sidebar-close" aria-label="关闭列表">×</button>
    </div>
    <div class="sidebar-head">
      <span>服务器实例</span>
      <span id="inst-count" class="faint"></span>
    </div>
    <div class="inst-list" id="inst-list"></div>
    <div class="sidebar-foot">
      <button class="btn primary block" id="btn-new">+ 新建服务器</button>
      <button class="btn ghost block" id="btn-import" style="margin-top:6px">导入已有服务端</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="打开服务器列表" aria-controls="sidebar" aria-expanded="false">
        <span class="bars" aria-hidden="true"></span>
      </button>
      <div class="tb-head">
        <div class="title" id="tb-title">载入中…</div>
        <div class="sub" id="tb-sub"></div>
      </div>
      <div class="spacer"></div>
      <div id="tb-chips"></div>
      <div id="tb-actions"></div>
    </header>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">概览</button>
      <button class="tab" data-tab="console">控制台</button>
      <button class="tab" data-tab="files">文件</button>
      <button class="tab" data-tab="config">配置</button>
      <button class="tab" data-tab="plugins">插件</button>
      <button class="tab" data-tab="world">世界</button>
      <button class="tab" data-tab="network">网络</button>
      <button class="tab" data-tab="settings">设置</button>
    </nav>
    <section id="view"></section>
  </main>
  <div id="sidebar-mask"></div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
